name: MAUI Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Ssomero/Ssomero.csproj
      - name: Build Debug APK
        run: dotnet publish Ssomero/Ssomero.csproj -f net10.0-android -c Debug -o publish/debug
      - name: Build Release APK
        run: dotnet publish Ssomero/Ssomero.csproj -f net10.0-android -c Release -o publish/release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maui-android-artifacts
          path: publish
