<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invitation to join as Lecturer</title>
  <style>
    body { font-family: Arial, sans-serif; color: #222 }
    .container { max-width: 600px; margin: 0 auto; padding: 16px }
    .header { background: #0b5; padding: 12px; color: white }
    .btn { display: inline-block; padding: 10px 16px; background: #0069d9; color: white; text-decoration: none; border-radius: 4px }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>{{UniversityName}}</h1></div>
    <p>Dear {{InviteeName}},</p>
    <p>{{InviterName}} invites you to join as a lecturer for <strong>{{ClassName}}</strong>.</p>
    <p>Click the link below to accept:</p>
    <p><a class="btn" href="{{AcceptUrl}}">Accept Invitation</a></p>
    <p>This invitation expires on {{ExpiresAt}}.</p>
    <p>Sincerely,<br/>{{UniversityName}} team</p>
  </div>
</body>
</html>
