version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Data Source=ssomero.db
    volumes:
      - ./wwwroot:/app/wwwroot

  redis:
    image: redis:7
    ports:
      - "6379:6379"
